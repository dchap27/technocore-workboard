[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "technocore-workboard"
version = "0.1.0"
description = "Signed, auditable agent-work coordination on Technocore"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Technocore Workboard contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
workboard = "technocore_workboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/technocore_workboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
